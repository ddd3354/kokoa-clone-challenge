<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="css/6.library.css" />
  </head>
  <body>
    <!-- 상단바 -->
    <header class="library">
      <div class="library__icons">
        <i class="fa-solid fa-bars fa-2x"></i>
      </div>
      <div class="library__icons">
        <h2>library</h2>
      </div>
      <div class="library__icons">
        <i class="fa-solid fa-bag-shopping fa-2x"></i>
      </div>
    </header>

    <!-- Search 창-->
    <div class="search">
      <div class="search__element">
        <div class="search__element--text">Search plz book!!</div>
        <div class="search__element--icon">
          <i class="fa-solid fa-magnifying-glass-arrow-right fa-lg"></i>
        </div>
      </div>
    </div>

    <!-- 추천책 -->
    <div class="book-title">
      <div class="book-title__name">
        <h2>오늘의 추천 책</h2>
      </div>

      <div class="book-title__info">
        <div class="book-title__info--img">
          <img src="img/책1.jpg" alt="book-cover" />
        </div>

        <div class="book-title__info--content">
          <h2>하늘과</h2>
          <h3>바람과 별과</h3>
          <div class="book-title__info--star">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star-half"></i>
          </div>

          <div class="book-title__info--cf">
            <span class="book-title__info--cf__box">좋은책</span>
            <span class="book-title__info--cf__box">유명한 책</span>
          </div>

          <div class="book-title__info--pay">
            <span><i class="fa-solid fa-circle-check fa-lg"></i></span>
            <span>당장보기</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 베스트셀러 -->
    <div class="top-rank">
      <div class="top-rank__title">
        <h2>베스트셀러</h2>
      </div>

      <div class="top-rank__books">
        <div class="top-rank__books--content">
          <img src="img/책2.jpg" />
          <div class="top-rank__books--content__star">
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
          </div>
        </div>
        <div class="top-rank__books--content">
          <img src="img/책3.jpg" />
          <div class="top-rank__books--content__star">
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
          </div>
        </div>
        <div class="top-rank__books--content">
          <img src="img/책4.jpg" />
          <div class="top-rank__books--content__star">
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
          </div>
        </div>
        <div class="top-rank__books--content">
          <img src="img/책5.jpg" />
          <div class="top-rank__books--content__star">
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
          </div>
        </div>
        <div class="top-rank__books--content">
          <img src="img/책66.jpg" />
          <div class="top-rank__books--content__star">
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
            <i class="fa-solid fa-star fa-2xs"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- 작가 -->
    <div class="writer">
      <div class="writer__name">
        <h2>윤동주</h2>
      </div>

      <div class="writer__info">
        <div class="writer__info--img">
          <img src="img/윤동주.jpeg" />
        </div>

        <div class="writer__info--content">
          <h2>하늘과</h2>
          <h3>바람과 별과</h3>

          <div class="writer__info--cf">
            <p>
              1917년 12월 30일 중화민국 길림성 화룡현 명동촌 (현 중국 지린성
              연변 조선족 자치주 룡정시 지신진 명동촌)의 유복한 집안에서 개신교
              장로이자 소학교 교사인 아버지 윤영석과 어머니 김용 사이의 7남매 중
              장남으로 태어났다.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://kit.fontawesome.com/343146c1ba.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
