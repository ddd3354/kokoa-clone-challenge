<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist</title>
    <link rel="stylesheet" href="css/5.playlist.css" />
  </head>
  <body>
    <!-- 상단바 -->
    <header class="play-list">
      <div class="play-list__bar">
        <div class="play-list__bar--left">X</div>
        <div class="play-list__bar--right">Playlist</div>
      </div>
    </header>

    <!-- 랜덤러브 -->
    <main class="random-love">
      <div class="random-love__img">
        <div class="random-love__img--box"></div>
        <i class="fa-solid fa-image fa-4x"></i>
      </div>

      <div class="random-love__title">
        <div class="random-love__title--large">
          <div>Random</div>
          <div>Love</div>
        </div>

        <div class="random-love__title--small">by Divay Kapoor</div>
      </div>
    </main>

    <!-- 중간 버튼 부분 -->
    <div class="mid-bar">
      <div class="mid-bar__sumit">
        <div class="mid-bar__sumit--play">
          <i class="fa-solid fa-play"></i>
        </div>
        <div class="mid-bar__sumit--title">Play</div>
      </div>

      <div class="mid-bar__sumit">
        <div>
          <i class="fa-regular fa-heart"></i>
        </div>
      </div>

      <div class="mid-bar__sumit">
        <div>
          <i class="fa-solid fa-plus"></i>
        </div>
      </div>
    </div>

    <div class="song-list">
      <div class="song-list__album">
        <div class="song-list__album--box red"></div>

        <div class="song-list__album--title">
          <div class="song-list__album--large">Matargasti</div>
          <div class="song-list__album--small">Mohit Chauhan</div>
        </div>
      </div>

      <div class="song-list__album">
        <div class="song-list__album--box pink"></div>

        <div class="song-list__album--title">
          <div class="song-list__album--large">Attitude</div>
          <div class="song-list__album--small">Lewis OfMan·Attitude</div>
        </div>
      </div>

      <div class="song-list__album">
        <div class="song-list__album--box blue"></div>

        <div class="song-list__album--title">
          <div class="song-list__album--large">Try Everthing</div>
          <div class="song-list__album--small">Shakira·Zootopia</div>
        </div>
      </div>

      <div class="song-list__album">
        <div class="song-list__album--box turquoise"></div>

        <div class="song-list__album--title">
          <div class="song-list__album--large">Sunflower</div>
          <div class="song-list__album--small">Joseph Vincent·Sunflower</div>
        </div>
      </div>
    </div>

    <script
      src="https://kit.fontawesome.com/343146c1ba.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
