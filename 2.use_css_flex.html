<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Use an external CSS stylesheet.</title>
  </head>

  <style>
    body {
      height: 100vh;
      background-color: tomato;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #mid {
      background-color: rgb(245, 222, 179);
      width: 400px;
      height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      border: 3px solid black;
    }

    .inside {
      background-color: teal;
    }

    .num {
      width: 80px;
      height: 80px;
      border: 3px solid white;
    }

    .num2 {
      width: 340px;
      height: 80px;
      border: 3px dashed white;
    }
  </style>

  <body>
    <div id="mid">
      <div class="inside num"></div>
      <div class="inside num2"></div>
      <div class="inside num"></div>
    </div>
  </body>
</html>
