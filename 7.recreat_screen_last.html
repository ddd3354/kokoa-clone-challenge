<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/7.recreat_last.css" />
  </head>
  <body>
    <main class="two-screen">
      <!-- 1번 스크린 -->
      <div class="two-screen__content">
        <!-- 상단바 -->
        <div class="two-screen__top-bar">
          <span class="two-screen__top-bar-dir">
            <i class="fa-solid fa-left-long fa-2x"></i>
          </span>
          <span class="two-screen__top-bar-search">
            <i class="fa-solid fa-magnifying-glass-chart fa-2x"></i>
          </span>
        </div>
        <!-- 프로필 img -->
        <div class="two-screen__img">
          <img src="img/yb.jpg" />
        </div>
        <!-- 타이틀 -->
        <div class="two-screen__title">
          <h1>YB Band</h1>
          <h3>"band, rock"</h3>
        </div>

        <!-- 구독 -->
        <div class="two-screen__sub">
          <span>구독</span>
          <span>
            <i class="fa-solid fa-star"></i>
            저장
          </span>
        </div>

        <!-- 노래 리스트 -->
        <ul class="two-screen__list">
          <li class="two-screen__list-song">
            <div><img src="img/나는 나비.jpg" /></div>

            <div class="two-screen__list-title">
              <span>
                <h4>YB Band</h4>
                <h3>나는 나비</h3>
              </span>
              <span><i class="fa-solid fa-toggle-off fa-xl"></i></span>
            </div>
          </li>
          <li class="two-screen__list-song">
            <div><img src="img/흰수염고래.jpg" /></div>

            <div class="two-screen__list-title">
              <span>
                <h4>YB Band</h4>
                <h3>흰수염고래</h3>
              </span>
              <span><i class="fa-solid fa-toggle-off fa-xl"></i></span>
            </div>
          </li>

          <li class="two-screen__list-song">
            <div><img src="img/요즘 내 모습.jpg" /></div>

            <div class="two-screen__list-title">
              <span>
                <h4>YB Band</h4>
                <h3>요즘 내 모습</h3>
              </span>
              <span><i class="fa-solid fa-toggle-off fa-xl"></i></span>
            </div>
          </li>
          <li class="two-screen__list-song">
            <div><img src="img/사랑했나봐.jpg" /></div>

            <div class="two-screen__list-title">
              <span>
                <h4>YB Band</h4>
                <h3>사랑했나봐</h3>
              </span>
              <span><i class="fa-solid fa-toggle-off fa-xl"></i></span>
            </div>
          </li>
        </ul>

        <!-- 재생바 -->
        <div class="two-screen__bottom-bar">
          <div class="two-screen__bottom-bar--text">
            <h4>YB Band</h4>
            <h3>요즘 내 모습</h3>
          </div>
          <div class="two-screen__bottom-bar--icons">
            <span><i class="fa-solid fa-backward-step fa-xl"></i></span>
            <span><i class="fa-solid fa-stop fa-2x"></i></span>
            <span><i class="fa-solid fa-forward-step fa-xl"></i></span>
          </div>
        </div>
      </div>

      <!-- 2번 스크린 -->
      <div class="two-screen__content second-screen">
        <!-- 탑바 -->
        <div class="two-screen__top-bar second-screen__top-bar">
          <span class="two-screen__top-bar-dir">
            <i class="fa-solid fa-left-long fa-2x"></i>
          </span>
          <span class="two-screen__top-bar-search">
            <i class="fa-brands fa-soundcloud fa-2x"></i>
          </span>
        </div>

        <!-- 프로필 img -->
        <div class="two-screen__img second-screen__img">
          <img src="img/요즘 내 모습.jpg" />
        </div>
        <!-- 타이틀 -->
        <div class="two-screen__title second-screen__title">
          <h2>요즘 내 모습</h2>
          <h3>YB Band</h3>
        </div>

        <!-- 재생 시간 -->
        <div class="second-screen__time">
          <span>2:15</span><span>4:32</span>
        </div>

        <!-- 재생바 -->
        <div class="second-screen__play-bar">
          <div class="second-screen__play-bar-element"></div>
          <div class="second-screen__play-bar-element"></div>
          <div class="second-screen__play-bar-element"></div>
        </div>

        <!-- 하단 버튼 -->
        <div class="second-screen__btns">
          <div class="second-screen__btn">
            <i class="fa-brands fa-deezer fa-2x"></i>
          </div>
          <div class="second-screen__btn">
            <i class="fa-solid fa-backward fa-2x"></i>
          </div>
          <div class="second-screen__btn">
            <i class="fa-solid fa-play fa-2x"></i>
          </div>
          <div class="second-screen__btn">
            <i class="fa-solid fa-forward-step fa-2x"></i>
          </div>
          <div class="second-screen__btn">
            <i class="fa-brands fa-chromecast fa-2x"></i>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://kit.fontawesome.com/343146c1ba.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
