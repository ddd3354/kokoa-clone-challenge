<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master of the form</title>
</head>

<body>
    <h1>Create An Account </h1>

    <form>
        <label for="first_name">
        <div>
            <span>First name</span>
            <span>
                <input id="first_name" type="text" placeholder="First name" required/>
            </span>
        </div>
        </label>

        <label for="last_name">
        <div>
            <span>Last name</span>
            <span>
                <input id="last_name" type="text" placeholder="last name" required/>
            </span>
        </div>
        </label>

        <label for="email">
        <div>
            <span>Email</span>
            <span>
                <input id="email" type="email" placeholder="Email" required/>
            </span>
        </div>
        </label>

        <label for="username">
        <div>
            <span>Username</span>
            <span>
                <input id="username" type="text" placeholder="Username" required/>
            </span>
        </div>
        </label>

        <label for="password">
        <div>
            <span>Password</span>
            <span>
                <input id="password" type="password"
                 placeholder="Password" minlength="10" required  />
            </span>
        </div>
        </label>

        <label for="birthdate">
        <div>
            <span>Birth date</span>
            <span>
                <input id="birthdate" type="date" required/>
            </span>
        </div>
        </label>

        <label for="range">
        <div>
            <span>How happy are you?</span>
            <span>
                <input id="range" type="range" required/>
            </span>
        </div>
        </label>

        <label for="color">
        <div>
            <span>What is your fav color?</span>
            <span>
                <input id="color" type="color" required/>
            </span>
        </div>
        </label>

        <div>
            <input type="submit" value="Create Account" required/>
        </div>

        


        
    </form>
</body>
</html>
